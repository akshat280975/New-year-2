<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Year Surprise 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .bounce { animation: bounce 2s infinite; }

    .scrapbook-card {
      background: white;
      border: 4px solid #ff6b9d;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
      transform: rotate(-1deg);
    }

    .polaroid-frame {
      background: white;
      padding: 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,.2);
      transform: rotate(2deg);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6"
      style="background:linear-gradient(135deg,#ffeef8,#ffd93d50);">

  <main class="text-center max-w-4xl w-full">

    <div class="bounce text-6xl mb-4">🎆</div>

    <h1 id="main-title" class="text-5xl font-bold mb-4 text-pink-500">
      Our New Year 💖
    </h1>

    <p id="countdown-label" class="mb-8 text-lg font-semibold">
      Counting down to our first moment of the New Year together ✨
    </p>

    <!-- COUNTDOWN -->
    <div id="countdown-container" class="grid grid-cols-4 gap-4 mb-10">
      <div class="bg-white p-4 rounded-xl border-2 border-pink-400">
        <div id="days" class="text-3xl font-bold text-pink-500">00</div>Days
      </div>
      <div class="bg-white p-4 rounded-xl border-2 border-pink-400">
        <div id="hours" class="text-3xl font-bold text-pink-500">00</div>Hours
      </div>
      <div class="bg-white p-4 rounded-xl border-2 border-pink-400">
        <div id="minutes" class="text-3xl font-bold text-pink-500">00</div>Minutes
      </div>
      <div class="bg-white p-4 rounded-xl border-2 border-pink-400">
        <div id="seconds" class="text-3xl font-bold text-pink-500">00</div>Seconds
      </div>
    </div>

    <!-- SURPRISE -->
    <div id="surprise-section" class="hidden">

      <div class="scrapbook-card rounded-3xl p-8 mb-8">
        <h2 class="text-3xl font-bold text-pink-500 mb-2">
          Happy New Year My Love 💕
        </h2>
        <p class="text-lg">
          This little scrapbook is my surprise for you ❤️
        </p>
      </div>

      <div class="scrapbook-card rounded-3xl p-8">
        <div id="slide-content"></div>

        <div class="flex justify-between mt-8">
          <button id="prev-btn"
            class="px-6 py-2 bg-yellow-300 rounded-xl font-bold">
            ⬅ Back
          </button>

          <button id="next-btn"
            class="px-6 py-2 bg-yellow-300 rounded-xl font-bold">
            Next ➡
          </button>
        </div>
      </div>
    </div>

  </main>

<script>
  const memories = [
    { title:"🌟 First Hello", text:"When we first met and everything changed..." },
    { title:"🎉 Best Times", text:"All the beautiful moments we shared..." },
    { title:"😂 Silly Moments", text:"The laughs that made us closer..." },
    { title:"💖 Sweet Memories", text:"Moments I’ll always cherish..." },
    { title:"🚀 Our Future", text:"A lifetime of memories waiting for us..." }
  ];

  let currentSlide = 0;

  // NEXT NEW YEAR
  const targetDate = new Date(
    new Date().getFullYear() + 1, 0, 1, 0, 0, 0
  ).getTime();

  function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
      document.getElementById("countdown-container").classList.add("hidden");
      document.getElementById("surprise-section").classList.remove("hidden");
      showSlide();
      return;
    }

    document.getElementById("days").textContent =
      Math.floor(distance / (1000*60*60*24));
    document.getElementById("hours").textContent =
      Math.floor((distance / (1000*60*60)) % 24);
    document.getElementById("minutes").textContent =
      Math.floor((distance / (1000*60)) % 60);
    document.getElementById("seconds").textContent =
      Math.floor((distance / 1000) % 60);
  }

  function showSlide() {
    const m = memories[currentSlide];
    document.getElementById("slide-content").innerHTML = `
      <div class="text-center">
        <div class="polaroid-frame mx-auto mb-6">
          <img src="photos/photo${currentSlide+1}.jpg"
               class="w-[260px] h-[200px] object-cover rounded-md"/>
        </div>
        <h3 class="text-2xl font-bold mb-2">${m.title}</h3>
        <p class="text-lg">${m.text}</p>
      </div>
    `;
  }

  document.getElementById("prev-btn").onclick = () => {
    if (currentSlide > 0) {
      currentSlide--;
      showSlide();
    }
  };

  document.getElementById("next-btn").onclick = () => {
    if (currentSlide < memories.length - 1) {
      currentSlide++;
      showSlide();
    }
  };

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
